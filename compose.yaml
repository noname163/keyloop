services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keyloop}
      POSTGRES_USER: ${POSTGRES_USER:-keyloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  application:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-keyloop}
      DB_USERNAME: ${POSTGRES_USER:-keyloop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      SALES_SYSTEM_BASE_URL: ${SALES_SYSTEM_BASE_URL:-http://host.docker.internal:8081}
      SERVICE_SYSTEM_BASE_URL: ${SERVICE_SYSTEM_BASE_URL:-http://host.docker.internal:8082}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
