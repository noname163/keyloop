services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keyloop}
      POSTGRES_USER: ${POSTGRES_USER:-keyloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  application:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-keyloop}
      DB_USERNAME: ${POSTGRES_USER:-keyloop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SALES_SYSTEM_BASE_URL: ${SALES_SYSTEM_BASE_URL:-https://6a7a6b608c69b3eb4a173191.mockapi.io/api/external/sales-service}
      SERVICE_SYSTEM_BASE_URL: ${SERVICE_SYSTEM_BASE_URL:-https://6a7a6b608c69b3eb4a173191.mockapi.io/api/external/services-document}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
