spring.application.name=unifieddocumentviewer

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool configuration
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS}

# External document source APIs
sales.system.base-url=${SALES_SYSTEM_BASE_URL}
service.system.base-url=${SERVICE_SYSTEM_BASE_URL}
