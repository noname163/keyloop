spring.application.name=unifieddocumentviewer

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unifieddocumentviewer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool configuration
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# External document source APIs
sales.system.base-url=${SALES_SYSTEM_BASE_URL:http://localhost:8081}
service.system.base-url=${SERVICE_SYSTEM_BASE_URL:http://localhost:8082}
