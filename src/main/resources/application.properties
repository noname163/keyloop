spring.application.name=unifieddocumentviewer

# Structured log rotation defaults
LOG_PATH=${LOG_PATH:logs}
LOG_MAX_HISTORY=${LOG_MAX_HISTORY:30}
LOG_TOTAL_SIZE_CAP=${LOG_TOTAL_SIZE_CAP:1GB}
AUDIT_LOG_MAX_HISTORY=${AUDIT_LOG_MAX_HISTORY:30}
AUDIT_LOG_TOTAL_SIZE_CAP=${AUDIT_LOG_TOTAL_SIZE_CAP:1GB}
audit.lookup.max-days=${AUDIT_LOOKUP_MAX_DAYS:7}

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool configuration
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS}

# External document source APIs
sales.system.base-url=${SALES_SYSTEM_BASE_URL}
service.system.base-url=${SERVICE_SYSTEM_BASE_URL}
